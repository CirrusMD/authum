[project]
name = "authum"
version = "1.1.0"
authors = [
    { name = "CirrusMD", email = "devops@cirrusmd.com" }
]
description = "Awesome authentication tool for connecting command line applications to SAML/OIDC identity and service providers"
readme = "README.md"
requires-python = "~=3.9"
dependencies = [
    "arn~=0.1.5",
    "beautifulsoup4~=4.10",
    "boto3~=1.19",
    "click~=8.0",
    "Flask~=2.0",
    "keyring~=23.2",
    "pluggy~=1.0",
    "pyyaml~=6.0",
    "requests~=2.26",
    "rich~=10.12"
]

[dependency-groups]
dev = [
    "Mako~=1.1",
    "pex~=2.1",
    "pytest~=6.2",
    "pytest-cov~=3.0",
    "pytest-xdist~=2.4",
    "responses~=0.15",
    "ruff~=0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
athm = "authum.cli:main"

[tool.pytest.ini_options]
log_level = "DEBUG"
